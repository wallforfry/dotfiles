# Inclus depuis ~/.ssh/config via « Include ~/.ssh/config.d/*.conf », ligne à
# placer avant tout bloc Host — ssh retient la première valeur rencontrée pour
# chaque option.
#
# RemoteCommand force zsh : sur DSM le shell de login est /bin/sh et n'est même
# pas lancé comme shell de login, donc ni chsh ni ~/.profile ne peuvent servir
# de point d'accroche.
#
# Contrepartie : avec RemoteCommand, « ssh nas <commande> », scp et rsync
# échouent. Les contourner avec -o RemoteCommand=none :
#   scp -o RemoteCommand=none fichier nas.zov.ist:
#   rsync -e 'ssh -o RemoteCommand=none' ...

Host nas.zov.ist 192.168.1.63
    User delevacw
    Port 22
    ForwardAgent yes
    RequestTTY yes
    RemoteCommand exec /usr/local/bin/zsh -l

Host nas.zov.ist
    HostName 10.242.193.43
